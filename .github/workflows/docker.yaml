
name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Sync multi-arch images to Aliyun
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Install skopeo
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq skopeo
        skopeo --version

    - name: Sync multi-arch images to Aliyun ACR
      run: |
        # ============================================================
        # 聚合镜像（多架构）同步：
        #   skopeo copy --all 直接搬运源仓库的多架构索引（manifest list），
        #   推送后一个 tag 同时含 amd64/arm64/...，节点按架构自动拉取。
        #   相比原 docker pull + tag + push（单架构+架构后缀），不再需要
        #   docker daemon 和本地磁盘空间（流式传输），也不再产生
        #   -amd64/-arm64 这种"假架构标签"。
        # ============================================================

        # 1) 预处理：解析 images.txt，按镜像去重
        #    （amd64/arm64 双行会自动合并为一行聚合镜像；--platform 参数在
        #      聚合模式下自动忽略，源镜像支持什么平台就全量搬什么平台）
        declare -A images_map        # 清理后的镜像引用 -> 1
        declare -A duplicate_names   # 同名但不同命名空间的镜像名
        declare -A ns_map            # 镜像名 -> 命名空间

        while IFS= read -r line || [ -n "$line" ]; do
          [[ -z "$line" ]] && continue
          echo "$line" | grep -q '^\s*#' && continue
          # 去掉 --platform=xxx / --platform xxx 参数
          image=$(echo "$line" | sed 's/--platform[ =][^ ]*//g' | awk '{print $NF}')
          # 去掉 @sha256:xxx
          image="${image%%@*}"
          [ -z "$image" ] && continue
          images_map["$image"]=1

          # 重名判断（与原版逻辑一致）：同名不同命名空间时加前缀
          image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
          image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
          name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
          [ -z "$name_space" ] && name_space="_"
          if [[ -n "${ns_map[$image_name]}" ]]; then
            if [[ "${ns_map[$image_name]}" != "$name_space" ]]; then
              echo "duplicate image name: $image_name"
              duplicate_names[$image_name]=1
            fi
          else
            ns_map[$image_name]=$name_space
          fi
        done < images.txt

        echo "待同步镜像（去重后）："
        for k in "${!images_map[@]}"; do echo "  - $k"; done

        # 2) 逐个同步（skopeo 流式传输，无需本地磁盘）
        for image in "${!images_map[@]}"; do
          image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
          image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
          name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
          prefix=""
          if [[ -n "${duplicate_names[$image_name]}" ]] && [[ -n "$name_space" ]]; then
            prefix="${name_space}_"
          fi
          image_name_tag="${image_name_tag%%@*}"
          dest="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${prefix}${image_name_tag}"

          echo "======================================================"
          echo "==> skopeo copy --all  $image  ->  $dest"
          echo "======================================================"
          # 源仓库需要认证时，追加 --src-creds "用户名:密码"（如私有 ghcr）
          skopeo copy --all \
            --retry-times 3 \
            --dest-creds "$ALIYUN_REGISTRY_USER:$ALIYUN_REGISTRY_PASSWORD" \
            "docker://${image}" \
            "docker://${dest}"

          # 3) 验证：确认目标 tag 是否为多架构索引
          echo "==> 验证 $dest :"
          skopeo inspect --raw "docker://${dest}" 2>/dev/null \
            | python3 -c '
        import sys, json
        try:
            d = json.load(sys.stdin)
            if "manifests" in d:
                archs = [(m.get("platform") or {}).get("architecture") for m in d["manifests"]]
                print("    ✓ 多架构索引，平台数:", len(archs), "->", ", ".join(a or "?" for a in archs))
            else:
                print("    ! 单架构镜像（源镜像本身不是多架构）")
        except Exception:
            print("    ! 验证跳过")
        '
        done

